<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCRENZO | Premium Engineered Device Armor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { obsidian: '#0A0A0B', darkGrey: '#141416', electricCyan: '#00E5FF' } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0A0A0B; color: #FFFFFF; }</style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="border-b border-white/10 bg-obsidian/90 sticky top-0 z-50 px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="text-2xl font-extrabold tracking-wider">SCREN<span class="text-electricCyan">ZO</span></div>
      <div class="text-xs text-gray-400 font-mono bg-white/5 px-3 py-1 rounded-full border border-white/10">PREVIEW MODE</div>
    </div>
  </header>

  <main class="flex-grow flex flex-col items-center justify-center px-4 py-16 text-center max-w-4xl mx-auto">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-electricCyan/10 border border-electricCyan/20 text-xs font-semibold tracking-wider text-electricCyan mb-6 uppercase">
      ⚡ Armor Engineered Lab
    </div>
    <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">
      Invisible Protection.<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-500">Uncompromising Clarity.</span>
    </h1>
    <p class="text-gray-400 max-w-lg mb-10 text-sm md:text-base">
      High-grade defensive glass tailored to fit your device seamlessly. No bubbles, no edge peeling, pure optical defense.
    </p>

    <div class="w-full max-w-md bg-darkGrey border border-white/10 rounded-2xl p-6 text-left shadow-2xl">
      <h3 class="text-md font-bold text-white mb-4 uppercase tracking-wider text-gray-300">Select Your Model</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">1. Phone Brand</label>
          <select id="brandDrop" class="w-full bg-obsidian border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-electricCyan appearance-none cursor-pointer">
            <option value="">Select Manufacturer...</option>
            <option value="Apple">Apple</option>
            <option value="Samsung">Samsung</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1.5">2. Specific Model</label>
          <select id="modelDrop" disabled class="w-full bg-obsidian border border-white/10 rounded-xl px-4 py-3 text-gray-500 focus:outline-none focus:border-electricCyan appearance-none cursor-not-allowed">
            <option value="">Select a brand first...</option>
          </select>
        </div>
        <button id="findArmorBtn" disabled class="w-full bg-white/5 text-gray-500 font-bold py-3.5 rounded-xl transition-all duration-300 uppercase tracking-wider text-xs mt-2">
          Unlock Tailored Armor
        </button>
      </div>
    </div>
  </main>

  <footer class="border-t border-white/5 bg-obsidian py-6 text-center text-xs text-gray-600">
    &copy; 2026 SCRENZO Premium Lab. High impact architecture protection.
  </footer>

  <script>
    const brandDrop = document.getElementById('brandDrop');
    const modelDrop = document.getElementById('modelDrop');
    const findArmorBtn = document.getElementById('findArmorBtn');

    const devices = {
      Apple: ['iPhone 17 Pro', 'iPhone 17 Pro Max'],
      Samsung: ['Galaxy S26 Ultra']
    };

    brandDrop.addEventListener('change', (e) => {
      const b = e.target.value;
      if(b) {
        modelDrop.disabled = false;
        modelDrop.className = "w-full bg-obsidian border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-electricCyan appearance-none cursor-pointer";
        modelDrop.innerHTML = '<option value="">Choose your phone model...</option>';
        devices[b].forEach(m => modelDrop.innerHTML += `<option value="${m}">${m}</option>`);
      } else {
        modelDrop.disabled = true;
        modelDrop.className = "w-full bg-obsidian border border-white/10 rounded-xl px-4 py-3 text-gray-500 focus:outline-none focus:border-electricCyan appearance-none cursor-not-allowed";
        modelDrop.innerHTML = '<option value="">Select a brand first...</option>';
        findArmorBtn.disabled = true;
        findArmorBtn.className = "w-full bg-white/5 text-gray-500 font-bold py-3.5 rounded-xl transition-all duration-300 uppercase tracking-wider text-xs mt-2 cursor-not-allowed";
      }
    });

    modelDrop.addEventListener('change', (e) => {
      if(e.target.value) {
        findArmorBtn.disabled = false;
        findArmorBtn.className = "w-full bg-electricCyan text-obsidian font-bold py-3.5 rounded-xl transition-all duration-300 uppercase tracking-wider text-xs mt-2 cursor-pointer font-bold shadow-[0_0_20px_rgba(0,229,255,0.25)] hover:scale-[1.01]";
      } else {
        findArmorBtn.disabled = true;
        findArmorBtn.className = "w-full bg-white/5 text-gray-500 font-bold py-3.5 rounded-xl transition-all duration-300 uppercase tracking-wider text-xs mt-2 cursor-not-allowed";
      }
    });

    findArmorBtn.addEventListener('click', () => {
      alert(`Connecting client interface to database server for the ${modelDrop.value}...`);
    });
  </script>
</body>
</html>
